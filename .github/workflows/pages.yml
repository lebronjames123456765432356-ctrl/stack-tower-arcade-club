
name: Publish UG Arcade Backup

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload arcade website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publish backup
        id: deployment
        uses: actions/deploy-pages@v4
